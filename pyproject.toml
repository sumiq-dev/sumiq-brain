[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-brain"
version = "0.1.0"
description = "A portable, agent-maintained second brain"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
providers = ["anthropic>=2.3", "openai>=3.40"]
dev = ["pytest>=8", "anthropic>=2.3", "openai>=3.40"]

[project.scripts]
brain = "aibrain.cli:main"

[tool.setuptools]
packages = ["aibrain"]

[tool.setuptools.package-data]
aibrain = ["conventions.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
